<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#176b52"><meta name="description" content="自然科教學資料、學生檔案與雲端備份入口。"><meta property="og:type" content="website"><meta property="og:title" content="教學資料庫｜自然課堂中控站"><meta property="og:image" content="https://prayer168.github.io/nature-classroom-hub/og-cover.jpg"><meta property="og:locale" content="zh_TW"><meta name="twitter:card" content="summary_large_image"><title>教學資料庫｜自然課堂中控站</title><link rel="stylesheet" href="css/style.css"></head>
<body data-page="resources"><a class="skip-link" href="#main">跳到主要內容</a><div id="app-shell"></div>
<main id="main" class="page" tabindex="-1">
  <header class="page-header"><div><p class="eyebrow">RESOURCE LIBRARY</p><h1>教學資料庫</h1><p>教材、學習單、學生作品與備份，依單元集中整理。</p></div><div class="page-actions"><input id="resource-file-input" type="file" multiple hidden><button class="btn btn-light" data-action="add-link">新增連結</button><button class="btn btn-primary" data-action="upload-resource">上傳檔案</button></div></header>
  <div class="storage-banner"><div><strong id="storage-mode-title">離線資料庫</strong><p id="storage-mode-copy">檔案只儲存在這台裝置的瀏覽器；可在設定中連接 Google Drive。</p></div><a class="btn btn-light" href="settings.html">管理串接</a></div>
  <section class="toolbar card compact"><label class="search-field"><span class="sr-only">搜尋教材</span><input id="resource-search" type="search" placeholder="搜尋檔名、單元或標籤"></label><label>分類<select id="resource-category"><option value="all">全部</option><option value="教材">教材</option><option value="學習單">學習單</option><option value="學生作品">學生作品</option><option value="評量">評量</option><option value="連結">連結</option></select></label><label>適用範圍<select id="resource-scope"><option value="current">目前年級＋通用</option><option value="all">全部年級</option></select></label></section>
  <section class="resource-grid" id="resource-grid"></section><div id="resource-empty" class="empty-state card" hidden><h2>資料庫還是空的</h2><p>上傳第一份教學資料，或加入常用自然科網站連結。</p></div>
</main><div id="toast-region" class="toast-region" aria-live="polite"></div><div id="modal-root"></div><script type="module" src="js/app.js"></script></body></html>
