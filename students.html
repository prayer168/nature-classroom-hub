<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#176b52"><meta name="description" content="管理自然課班級、學生與出席狀態。"><meta property="og:type" content="website"><meta property="og:title" content="學生與班級｜自然課堂中控站"><meta property="og:image" content="https://prayer168.github.io/nature-classroom-hub/og-cover.jpg"><meta property="og:locale" content="zh_TW"><meta name="twitter:card" content="summary_large_image"><title>學生與班級｜自然課堂中控站</title><link rel="stylesheet" href="css/style.css"></head>
<body data-page="students"><a class="skip-link" href="#main">跳到主要內容</a><div id="app-shell"></div>
<main id="main" class="page" tabindex="-1">
  <header class="page-header"><div><p class="eyebrow">CLASS & STUDENTS</p><h1>學生與班級</h1><p>全站只顯示學生編號，不儲存或顯示真實姓名。</p></div><div class="page-actions"><button class="btn btn-light" data-action="student-template">下載 CSV 範本</button><button class="btn btn-light" data-action="import-students">匯入學生資料</button><button class="btn btn-primary" data-action="add-student">新增學生</button></div></header>
  <section class="toolbar card compact"><label class="search-field"><span class="sr-only">搜尋學生</span><input id="student-search" type="search" placeholder="搜尋學生編號、座號或標籤"></label><label>顯示<select id="student-status-filter"><option value="all">全部學生</option><option value="present">今日到課</option><option value="absent">今日缺席</option><option value="late">今日遲到</option></select></label><label>排序<select id="student-sort"><option value="seat-asc">座號（小到大）</option><option value="points-desc">點數（高到低）</option><option value="points-asc">點數（低到高）</option><option value="grade-desc">成績（高到低）</option><option value="grade-asc">成績（低到高）</option></select></label><label class="switch-row inline-switch"><input id="show-inactive" type="checkbox"><span><strong>顯示停用學生</strong></span></label><button class="btn btn-quiet" data-action="export-students">匯出名冊</button><button class="btn btn-quiet" data-action="open-trash">回收筒<span id="trash-count" class="trash-count" hidden>0</span></button></section>
  <section class="student-analytics" aria-labelledby="student-analytics-title"><div id="student-analytics-stats" class="stats-grid"></div><article class="card student-chart-card"><div class="section-heading"><div><p class="eyebrow">ANALYTICS</p><h2 id="student-analytics-title">學生指標比較</h2><p id="student-chart-subtitle">顯示目前班級前 10 名，橫軸從 0 起算。</p></div><label>指標<select id="student-chart-metric"><option value="points">獎勵點數</option><option value="grade">學業平均</option></select></label></div><div id="student-comparison-chart" class="student-ranking-chart" role="img"></div></article></section>
  <section class="card"><div class="table-wrap"><table class="data-table"><thead><tr><th>學生編號</th><th>今日狀態</th><th>獎勵點數</th><th>學業平均</th><th>標籤</th><th><span class="sr-only">操作</span></th></tr></thead><tbody id="student-table-body"></tbody></table></div><div id="student-empty" class="empty-state" hidden><h2>找不到學生</h2><p>請調整搜尋條件，或新增第一位學生。</p></div></section>
</main><div id="toast-region" class="toast-region" aria-live="polite"></div><div id="modal-root"></div><script type="module" src="js/app.js"></script></body></html>
