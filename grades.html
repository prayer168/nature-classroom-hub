<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#176b52"><meta name="description" content="自然科權重成績簿與形成性評量。"><meta property="og:type" content="website"><meta property="og:title" content="成績與評量｜自然課堂中控站"><meta property="og:image" content="https://prayer168.github.io/nature-classroom-hub/og-cover.jpg"><meta property="og:locale" content="zh_TW"><meta name="twitter:card" content="summary_large_image"><title>成績與評量｜自然課堂中控站</title><link rel="stylesheet" href="css/style.css"></head>
<body data-page="grades"><a class="skip-link" href="#main">跳到主要內容</a><div id="app-shell"></div>
<main id="main" class="page" tabindex="-1">
  <header class="page-header"><div><p class="eyebrow">ASSESSMENT</p><h1>成績與評量</h1><p>把紙筆、實作、探究紀錄分開追蹤，再依權重計算學期表現。</p></div><div class="page-actions"><input id="score-import-input" type="file" accept=".csv,text/csv" hidden><button class="btn btn-light" data-action="score-template">下載匯入範本</button><button class="btn btn-light" data-action="import-scores">匯入成績</button><button class="btn btn-light" data-action="export-grades">匯出成績</button><button class="btn btn-primary" data-action="add-assessment">新增評量</button></div></header>
  <section class="stats-grid" id="grade-stats"></section>
  <div id="weight-warning" class="notice weight-notice" hidden></div>
  <div id="import-undo" class="notice undo-notice" hidden></div>
  <section class="card"><div class="card-head"><div><p class="section-kicker">GRADEBOOK</p><h2 id="gradebook-title">成績簿</h2></div><div class="legend-inline"><span><i class="legend-dot formative"></i>形成性</span><span><i class="legend-dot summative"></i>總結性</span></div></div><div class="table-wrap gradebook-wrap"><table class="data-table gradebook"><thead id="gradebook-head"></thead><tbody id="gradebook-body"></tbody></table></div><p class="table-help">點選分數即可編輯，按 Enter 儲存，留白代表尚未評量。點欄位標題可編輯、複製或刪除該評量；點「缺」可標記缺考，缺考未補分時以應考平均 −5 計算。</p></section>
