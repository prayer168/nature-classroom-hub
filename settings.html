<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#176b52"><meta name="description" content="自然課堂中控站的 Google 串接、備份與隱私設定。"><meta property="og:type" content="website"><meta property="og:title" content="串接與設定｜自然課堂中控站"><meta property="og:image" content="./assets/images/og-cover.jpg"><meta property="og:locale" content="zh_TW"><meta name="twitter:card" content="summary_large_image"><title>串接與設定｜自然課堂中控站</title><link rel="stylesheet" href="css/style.css"></head>
<body data-page="settings"><a class="skip-link" href="#main">跳到主要內容</a><div id="app-shell"></div>
<main id="main" class="page narrow-page" tabindex="-1">
  <header class="page-header"><div><p class="eyebrow">INTEGRATIONS & PRIVACY</p><h1>串接與設定</h1><p>掌握資料存放位置、同步方式與備份狀態。</p></div></header>
  <section class="settings-stack">
    <article class="card integration-card"><div class="integration-logo google-logo">G</div><div class="integration-main"><div class="card-head"><div><p class="section-kicker">GOOGLE WORKSPACE</p><h2>Sheets、Docs、Drive 與 Sites</h2></div><span id="google-status" class="status-pill status-local">尚未連接</span></div><p>將 Google Apps Script 部署成 Web App 後，把網址貼在下方。系統可同步資料到 Sheets、上傳 Drive，並用 Docs 產生學習報告。</p><label class="field">Apps Script Web App 網址<input id="apps-script-url" type="url" placeholder="https://script.google.com/macros/s/.../exec"></label><div class="button-row"><button class="btn btn-primary" data-action="save-integration">儲存並測試</button><button class="btn btn-light" data-action="sync-now">立即同步</button><a class="btn btn-quiet" href="docs/google-integration.md">設定指南</a></div><p id="last-sync" class="muted"></p></div></article>
    <article class="card"><div class="card-head"><div><p class="section-kicker">BACKUP</p><h2>資料備份與還原</h2></div></div><p>完整備份包含班級、學生、出席、回饋、點數、評量及設定；教材檔案需另行下載或同步至 Drive。</p><div class="backup-actions"><button class="btn btn-primary" data-action="export-backup">下載 JSON 備份</button><label class="btn btn-light file-label">從備份還原<input id="backup-file" type="file" accept="application/json" hidden></label><button class="btn btn-danger-quiet" data-action="reset-demo">重設示範資料</button></div></article>
    <article class="card"><div class="card-head"><div><p class="section-kicker">PRIVACY</p><h2>隱私與課堂顯示</h2></div></div><div class="setting-rows"><label class="switch-row"><input id="private-observations" type="checkbox" checked><span><strong>觀察紀錄預設私密</strong><small>投影模式不顯示個別備註與點數</small></span></label><label class="switch-row"><input id="positive-only" type="checkbox" checked><span><strong>正向點數模式</strong><small>需要支持只記錄、不扣點</small></span></label><label class="switch-row"><input id="confirm-delete" type="checkbox" checked><span><strong>刪除前再次確認</strong><small>避免誤刪學生與教材</small></span></label></div></article>
  </section>
</main><div id="toast-region" class="toast-region" aria-live="polite"></div><div id="modal-root"></div><script type="module" src="js/app.js"></script></body></html>
